<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter · OIM3690</title>
  <style>
    :root {
      --bg: #14100c;
      --raised: #1d1811;
      --ink: #f3ece2;
      --muted: #c4b6a2;
      --accent: #d97757;
      --line: #2b241b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, serif;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }
    main {
      width: min(100%, 28rem);
      border: 1px solid var(--line);
      background: var(--raised);
      padding: 1.5rem;
    }
    h1 { margin: 0 0 0.4rem; font-size: 1.7rem; }
    p { color: var(--muted); }
    label {
      display: grid;
      gap: 0.35rem;
      margin: 1rem 0;
      font-size: 0.95rem;
    }
    input {
      width: 100%;
      padding: 0.7rem;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      font: inherit;
    }
    input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button {
      font: inherit;
      padding: 0.6rem 1rem;
      border: 0;
      background: var(--ink);
      color: var(--bg);
      cursor: pointer;
    }
    button:hover { background: var(--accent); }
    #result { min-height: 1.5rem; color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <h1>Temperature converter</h1>
    <p>Type in either box. Celsius and Fahrenheit stay in sync.</p>

    <label for="celsius">Celsius
      <input id="celsius" type="number" inputmode="decimal" value="20">
    </label>
    <label for="fahrenheit">Fahrenheit
      <input id="fahrenheit" type="number" inputmode="decimal">
    </label>
    <button id="convert" type="button">Convert</button>
    <p id="result"></p>
  </main>

  <script>
    // My predict-before-agent version:
    // function toFahrenheit(celsius) {
    //   return (celsius * 9 / 5) + 32;
    // }

    function toFahrenheit(celsius) {
      return (celsius * 9 / 5) + 32;
    }

    function toCelsius(fahrenheit) {
      return (fahrenheit - 32) * 5 / 9;
    }

    const celsiusInput = document.querySelector("#celsius");
    const fahrenheitInput = document.querySelector("#fahrenheit");
    const result = document.querySelector("#result");
    const convertButton = document.querySelector("#convert");

    function showFromCelsius() {
      const celsius = Number(celsiusInput.value);
      const fahrenheit = toFahrenheit(celsius);
      fahrenheitInput.value = fahrenheit;
      result.textContent = celsius + " C is " + fahrenheit + " F";
    }

    function showFromFahrenheit() {
      const fahrenheit = Number(fahrenheitInput.value);
      const celsius = toCelsius(fahrenheit);
      celsiusInput.value = celsius;
      result.textContent = fahrenheit + " F is " + celsius + " C";
    }

    convertButton.addEventListener("click", showFromCelsius);
    celsiusInput.addEventListener("input", showFromCelsius);
    fahrenheitInput.addEventListener("input", showFromFahrenheit);

    showFromCelsius();
  </script>
</body>
</html>
