<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playlist · OIM3690</title>
  <style>
    :root {
      --bg: #14100c;
      --raised: #1d1811;
      --ink: #f3ece2;
      --muted: #c4b6a2;
      --accent: #d97757;
      --line: #2b241b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, serif;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }
    main {
      width: min(100%, 28rem);
      border: 1px solid var(--line);
      background: var(--raised);
      padding: 1.5rem;
    }
    h1 { margin: 0 0 0.4rem; font-size: 1.7rem; }
    p { color: var(--muted); }
    label {
      display: grid;
      gap: 0.35rem;
      margin: 1rem 0;
      font-size: 0.95rem;
    }
    input {
      width: 100%;
      padding: 0.7rem;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      font: inherit;
    }
    input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button {
      font: inherit;
      padding: 0.6rem 1rem;
      border: 0;
      background: var(--ink);
      color: var(--bg);
      cursor: pointer;
    }
    button:hover { background: var(--accent); }
    #result { min-height: 1.5rem; color: var(--ink); }
    label.check { display: flex; align-items: center; gap: 0.5rem; }
    label.check input { width: auto; }
    ul { padding-left: 1.2rem; }
    li { margin: 0.3rem 0; }
    .row { display: flex; gap: 0.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Playlist</h1>
    <p>Add a song and it joins the list.</p>

    <ul id="playlist"></ul>

    <div class="row">
      <input id="song" type="text" placeholder="Song title" aria-label="Song title">
      <button id="add" type="button">Add song</button>
    </div>
  </main>

  <script src="js/playlist.js"></script>
</body>
</html>
