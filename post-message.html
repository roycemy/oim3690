<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Board</title>
</head>
<body>
  <h1>Message Board</h1>
  <input id="text" type="text" placeholder="Write a message...">
  <button id="postBtn">Post</button>
  <p id="status"></p>

  <script>
    // Posts a message to the class message board. The token is my GitHub username.
    async function postMessage(text) {
      const response = await fetch("https://oim.zhili.dev/message", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Token": "roycemy"
        },
        body: JSON.stringify({ message: text })
      });
      const data = await response.json();
      console.log(data);
      return data;
    }

    const textInput = document.querySelector('#text');
    const postBtn = document.querySelector('#postBtn');
    const statusEl = document.querySelector('#status');

    postBtn.addEventListener('click', async () => {
      const text = textInput.value.trim();
      if (!text) {
        statusEl.textContent = 'Type a message first.';
        return;
      }
      postBtn.disabled = true;
      statusEl.textContent = 'Posting...';
      try {
        await postMessage(text);
        statusEl.textContent = 'Posted!';
        textInput.value = '';
      } catch (error) {
        statusEl.textContent = 'Error: ' + error.message;
      } finally {
        postBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
